# 生产部署编排：指数边界（Index Boundary）
# 用法：APP_PORT=<宿主机端口> docker compose up -d --build
# 宿主机端口通过环境变量注入（不写入仓库），仅绑定本机回环地址。
# 对外访问由站点管理面板统一配置反向代理；路径前缀 /index-boundary（basePath），原样转发、不要剥路径。
# 数据卷 index-boundary-data 持久化数据库（data/game.db）。
services:
  index-boundary:
    build:
      context: .
      args:
        BASE_PATH: /index-boundary
    image: index-boundary:latest
    container_name: index-boundary
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/index-boundary
    volumes:
      - index-boundary-data:/app/data
volumes:
  index-boundary-data: